name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Check if tag already exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} does not exist; proceeding."
          fi

      - name: Extract changelog entry
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="${VERSION}" '
            /^## / {
              if (found) exit
              if ($0 ~ "^## " ver "( - .*)?[[:space:]]*$") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No changelog entry found for ${VERSION} in CHANGELOG.md"
            exit 1
          fi

          echo "--- Release notes for ${VERSION} ---"
          cat release-notes.md

      - name: Set up JDK 25
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.check.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build jar
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew build --no-daemon

      - name: Update README version
        if: steps.check.outputs.exists == 'false'
        run: |
          NEW="${{ steps.version.outputs.version }}"
          OLD="$(git tag --sort=-version:refname | head -n1 || true)"

          if [ -n "${OLD}" ] && [ "${OLD}" != "${NEW}" ]; then
            perl -pi -e "s/\Q${OLD}\E/${NEW}/g" README.md
          fi

          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README to ${NEW}"
            git push origin master
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "refs/tags/${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "build/libs/BetterPlugin-${{ steps.version.outputs.version }}.jar"
