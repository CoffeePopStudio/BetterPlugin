name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please make sure it has not been requested before and describe the use case clearly.

  - type: textarea
    id: problem
    attributes:
      label: Use case / problem
      description: What problem would this feature solve? What is missing today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the API or feature look like?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other ways to solve this?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
