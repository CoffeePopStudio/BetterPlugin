name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先确认没有重复的 issue，并尽量描述清楚使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 要解决的问题
      description: 这个功能要解决什么问题？现在缺少什么？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望 API 或功能长什么样？

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他实现方式？

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
