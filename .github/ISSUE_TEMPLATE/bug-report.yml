name: Bug report
description: Report a problem with BetterPlugin
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Before submitting, please:

        - Check the [BetterPlugin documentation](https://CoffeePopStudio.github.io/BetterPlugin/)
        - Search existing issues to avoid duplicates

  - type: input
    id: version
    attributes:
      label: BetterPlugin version
      description: For example `26.8.1-mc26.1.2`
      placeholder: "26.8.1-mc26.1.2"
    validations:
      required: true

  - type: input
    id: paper-version
    attributes:
      label: Paper version
      placeholder: "26.1.2"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: JDK version
      placeholder: "25"

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - Plugin base (api.plugin)
        - Command API (api.command)
        - Exceptions (api.exception)
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide minimal reproduction steps or sample code.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?

  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      description: Paste any relevant logs or exceptions.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
